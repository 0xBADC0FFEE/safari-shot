name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm pack --dry-run
      - run: node dist/cli.js --version

  playwright:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/playwright"].version')" >> "$GITHUB_OUTPUT"

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A failed diff (unknown base on a new branch) exits non-zero, so it counts as changed.
      - id: diff
        run: |
          if git diff --quiet "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD -- src test calibration package.json package-lock.json 'tsconfig*.json'
          then echo code=false; else echo code=true; fi >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: [playwright, changes]
    # A skipped job satisfies the required Test check.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The image ships WebKit and its system libraries for this exact Playwright version; apt installs take 20+ minutes.
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
